name: Validate knowledgebase contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run collection contract validation
        run: python3 scripts/validate_collections.py
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
